name: Weekly data refresh

# Rebuilds the live season (etl.run_all is incremental — it merges the current
# season into the committed Parquet and leaves historical seasons frozen) and
# commits the refreshed data back. Streamlit Community Cloud watches the repo
# and redeploys on push. No Selenium/Chrome needed: pass networks / DNA are an
# offline batch, so this job only touches the FBref + Understat tables.
on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC
  workflow_dispatch: {}    # allow manual runs

permissions:
  contents: write          # needed to commit refreshed data files back

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4   # brings the committed parquets for the merge

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ETL needs the scraping deps (soccerdata/Understat), not just the lean
      # runtime set the deployed app uses.
      - name: Install dependencies
        run: pip install -r requirements-etl.txt

      - name: Run ETL (incremental — current season only)
        run: python -m etl.run_all

      - name: Commit refreshed data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/processed/*.parquet
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore(data): weekly refresh $(date -u +%Y-%m-%d)"
            git push
          fi
